<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Physical Area | BSAA Asset Management</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/departments.css}">
</head>
<body>
    <header class="topbar">
        <a class="brand" th:href="@{/}">
            <span class="brand-icon">B</span>
            <span>
                <strong>BSAA</strong>
                <small>Asset Management</small>
            </span>
        </a>

        <form th:action="@{/logout}" method="post">
            <button class="logout-button" type="submit">Sign out</button>
        </form>
    </header>

    <main class="page-content">
        <section class="welcome">
            <p class="eyebrow">ORGANIZATION MANAGEMENT</p>
            <h1>Add Physical Area</h1>
            <p>Register a physical location for BSAA assets.</p>
        </section>

        <section class="department-panel">
            <p class="feedback-message error-message"
               th:if="${errorMessage != null}"
               th:text="${errorMessage}"></p>

            <form th:action="@{/physical-areas}"
                  method="post"
                  class="department-form">

                <div class="form-field">
                    <label for="name">Area Name</label>
                    <input type="text"
                           id="name"
                           name="name"
                           maxlength="100"
                           placeholder="e.g. Library"
                           required>
                </div>

                <div class="form-field">
                    <label for="description">Description (Optional)</label>
                    <textarea id="description"
                              name="description"
                              maxlength="255"
                              placeholder="Enter a short description of this area"></textarea>
                </div>

                <div class="form-actions">
                    <button class="primary-button" type="submit">
                        Save Physical Area
                    </button>

                    <a class="back-link" th:href="@{/physical-areas}">
                        Cancel
                    </a>
                </div>
            </form>
        </section>

        <footer>BSAA Asset Management System</footer>
    </main>
</body>
</html>
