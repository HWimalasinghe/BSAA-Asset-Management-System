
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Property Returns | BSAA Asset Management</title>
        <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    </head>
    <body>

        <header class="topbar">
            <a class="brand" th:href="@{/}">
                <span class="brand-icon">B</span>
                <span>
                    <strong>BSAA</strong>
                    <small>Asset Management</small>
                </span>
            </a>

            <form th:action="@{/logout}" method="post">
                <button class="logout-button" type="submit">Sign out</button>
            </form>
        </header>

        <main class="page-content">
            <section class="welcome">
                <p class="eyebrow">PROPERTY INVENTORY</p>
                <h1>Property Return History</h1>
                <p>Review returned properties, their conditions, and the staff involved.</p>
            </section>

            <section class="account-panel">
                <p th:if="${successMessage}"
                th:text="${successMessage}"
                style="color: #067647;"></p>

                <p th:if="${errorMessage}"
                th:text="${errorMessage}"
                style="color: #b42318;"></p>

                <div style="margin-bottom: 24px;">
                    <a th:if="${hasReturnPrivilege}" class="action-button" th:href="@{/returns/new}">
                        + Record Return
                    </a>

                    <a class="action-button" th:href="@{/assignments}">
                        Assignment History
                    </a>

                    <a class="action-button" th:href="@{/}">
                        Dashboard
                    </a>
                </div>

                <form class="list-filters" method="get" th:action="@{/returns}">
                    <div class="filter-grid">
                        <div class="filter-field filter-search">
                            <label for="search">Search</label>
                            <input id="search" name="search" type="search" th:value="${search}"
                                   placeholder="Asset code, type, holder or receiver"
                                   maxlength="100">
                        </div>

                        <div class="filter-field">
                            <label for="condition">Condition at return</label>
                            <select id="condition" name="condition">
                                <option value="">All conditions</option>
                                <option th:each="option : ${conditionOptions}"
                                        th:value="${option}" th:text="${option}"
                                        th:selected="${option == conditionFilter}"></option>
                            </select>
                        </div>

                        <div class="filter-field filter-size">
                            <label for="size">Rows per page</label>
                            <select id="size" name="size">
                                <option th:each="option : ${pageSizes}"
                                        th:value="${option}" th:text="${option}"
                                        th:selected="${option == pageSize}"></option>
                            </select>
                        </div>
                    </div>

                    <!-- Keep the current order when a filter is applied. -->
                    <input type="hidden" name="sort" th:value="${sortKey}">
                    <input type="hidden" name="dir" th:value="${sortDirection}">

                    <div class="filter-actions">
                        <button type="submit" class="primary-button">Apply filters</button>

                        <a class="back-link" th:if="${filtersActive}" th:href="@{/returns}">
                            Clear filters
                        </a>
                    </div>
                </form>

                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead>
                        <tr>
                            <th style="text-align: left; padding: 12px;">Return ID</th>
                            <th th:replace="~{fragments/list-nav :: sortableHeader('/returns', 'Property', 'code')}"></th>
                            <th th:replace="~{fragments/list-nav :: sortableHeader('/returns', 'Employee', 'holder')}"></th>
                            <th style="text-align: left; padding: 12px;">Returned By</th>
                            <th th:replace="~{fragments/list-nav :: sortableHeader('/returns', 'Received By', 'receiver')}"></th>
                            <th th:replace="~{fragments/list-nav :: sortableHeader('/returns', 'Condition', 'condition')}"></th>
                            <th th:replace="~{fragments/list-nav :: sortableHeader('/returns', 'Returned At', 'returned')}"></th>
                            <th style="text-align: left; padding: 12px;">Notes</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="propertyReturn : ${returns}">
                            <td style="padding: 12px;"
                                th:text="${propertyReturn.returnId}"></td>

                            <td style="padding: 12px;">
                                <strong th:text="${propertyReturn.assignment.property.propertyCode}"></strong>
                                <br>
                                <small th:text="${propertyReturn.assignment.property.propertyType.name}"></small>
                            </td>

                            <td style="padding: 12px;"
                                th:text="${propertyReturn.assignment.employee.firstName
                                    + ' '
                                    + propertyReturn.assignment.employee.lastName}">
                            </td>

                            <td style="padding: 12px;"
                                th:text="${propertyReturn.returnedBy.firstName
                                    + ' '
                                    + propertyReturn.returnedBy.lastName}">
                            </td>

                            <td style="padding: 12px;"
                                th:text="${propertyReturn.receivedBy.firstName
                                    + ' '
                                    + propertyReturn.receivedBy.lastName}">
                            </td>

                            <td style="padding: 12px;"
                                th:text="${propertyReturn.condition}"></td>

                            <td style="padding: 12px;"
                                th:text="${#temporals.format(propertyReturn.returnedAt, 'yyyy-MM-dd HH:mm')}">
                            </td>

                            <td style="padding: 12px;"
                                th:text="${propertyReturn.notes != null
                                    ? propertyReturn.notes
                                    : '-'}">
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(returns)}">
                            <td colspan="8"
                                style="padding: 24px; text-align: center;"
                                th:text="${filtersActive}
                                    ? 'No returns match this search or these filters.'
                                    : 'No property returns have been recorded yet.'"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div th:replace="~{fragments/list-nav :: pager('/returns')}"></div>
            </section>
        </main>
    </body>
</html>
