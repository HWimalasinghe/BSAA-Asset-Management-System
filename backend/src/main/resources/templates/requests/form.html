<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Edit Asset Request | BSAA Asset Management' : 'New Asset Request | BSAA Asset Management'}">Asset Request | BSAA Asset Management</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/properties.css}">
</head>
<body>
    <header class="topbar">
        <a class="brand" th:href="@{/}">
            <span class="brand-icon">B</span>
            <span>
                <strong>BSAA</strong>
                <small>Asset Management</small>
            </span>
        </a>

        <form th:action="@{/logout}" method="post">
            <button class="logout-button" type="submit">Sign out</button>
        </form>
    </header>

    <main class="page-content">
        <section class="welcome">
            <p class="eyebrow">REQUEST MANAGEMENT</p>
            <h1 th:text="${isEdit ? 'Edit Asset Request' : 'Submit Asset Request'}">Submit Asset Request</h1>
            <p th:text="${isEdit ? 'Update your pending equipment request details.' : 'Submit a new request for organizational equipment or assets.'}"></p>
        </section>

        <section class="property-panel">
            <p class="feedback-message error-message"
               th:if="${errorMessage != null}"
               th:text="${errorMessage}"></p>

            <form th:action="${isEdit ? '/requests/' + request.requestId + '/edit' : '/requests'}" method="post">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="propertyTypeId">Requested Item / Category *</label>
                        <select id="propertyTypeId" name="propertyTypeId" class="form-control" required>
                            <option value="">-- Select an item type --</option>
                            <option th:each="pt : ${propertyTypes}"
                                    th:value="${pt.propertyTypeId}"
                                    th:selected="${isEdit and !#lists.isEmpty(request.items) and request.items[0].propertyType.propertyTypeId == pt.propertyTypeId}"
                                    th:text="${pt.name + ' — Category: ' + pt.category.name + ' (' + pt.usageType + ')'}">
                            </option>
                        </select>
                        <small class="secondary-text">Select the category and type of equipment needed.</small>
                    </div>

                    <div class="form-group full-width">
                        <label for="quantity">Quantity *</label>
                        <input type="number" id="quantity" name="quantity" class="form-control" min="1" max="50" required
                               th:value="${isEdit and !#lists.isEmpty(request.items) ? request.items[0].quantity : 1}">
                        <small class="secondary-text">Maximum of 50 items allowed per request.</small>
                    </div>

                    <div class="form-group full-width">
                        <label for="notes">Purpose / Business Justification *</label>
                        <textarea id="notes" name="notes" class="form-control" rows="3" maxlength="500" required
                                  placeholder="State the reason/purpose for requesting this asset (e.g. For new team member onboarded to Operations, required by Nov 1st)..."
                                  th:text="${isEdit ? request.notes : ''}"></textarea>
                    </div>

                    <div class="form-group full-width">
                        <label for="itemNotes">Item Specifications / Preferences (Optional)</label>
                        <textarea id="itemNotes" name="itemNotes" class="form-control" rows="2" maxlength="255"
                                  placeholder="Any additional specifications, accessories, or department-specific requirements..."
                                  th:text="${isEdit and !#lists.isEmpty(request.items) ? request.items[0].notes : ''}"></textarea>
                    </div>
                </div>

                <div class="form-actions" style="margin-top: 24px; display: flex; gap: 12px; align-items: center;">
                    <button class="primary-button" type="submit"
                            th:text="${isEdit ? 'Save Changes' : 'Submit Request'}">
                        Submit Request
                    </button>

                    <a class="back-link" th:href="${isEdit ? '/requests/' + request.requestId : '/requests'}">
                        Cancel
                    </a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
