spring.application.name=bssa-asset-management

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/bssa_asset_management
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
# Statement logging stays off on the office server; a developer can turn it back
# over with SPRING_JPA_SHOW_SQL=true without editing this file.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false


app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}